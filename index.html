<!doctype html>
<html style="height: 100%;" xmlns="http://www.w3.org/1999/xhtml" lang="en">
  <head>
    <title>DevExtreme Demo</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn3.devexpress.com/jslib/26.1.3/css/dx.fluent.blue.light.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn3.devexpress.com/jslib/26.1.3/js/dx.all.js"></script>
    <script src="https://cdn3.devexpress.com/jslib/26.1.3/js/dx.ai-integration.js"></script>
    <script type="module">
      import { AzureOpenAI } from "https://esm.sh/openai@4.73.1";

      window.AzureOpenAI = AzureOpenAI;
    </script>
    <script src="data.js"></script>
    <script src="grid-commands.js"></script>
    <script src="form-commands.js"></script>
    <script src="chat-router.js"></script>
    <script src="ai-service.js"></script>
    <script src="index.js"></script>
    <style>
      #grid-container {
        margin-top: 20px;
        min-height: 336px;
      }

      #form-container {
        height: 164px;
        border: 1px solid #e0e0e0;
        padding: 16px;
      }

      .demo-container {
        margin: 20px;
        height: 556px;
      }

      .ai-chat-empty-icon {
        font-size: 32px;
        color: #337ab7;
        text-align: center;
        margin-bottom: 12px;
      }

      .ai-chat-empty-message {
        font-size: 18px;
        font-weight: 400;
        text-align: center;
        color: #242424;
        margin-bottom: 8px;
      }

      .ai-chat-empty-prompt {
        font-size: 14px;
        color: #888;
        text-align: center;
        padding: 0 24px;
      }

      .ai-chat-clear-button {
        margin-right: 8px;
      }

      .dx-popup-content {
        padding: 0;
      }

      .dx-chat {
        border-radius: 0px;
        min-height: 20em;
      }

      .dx-chat-messagebox {
        border-top-color: transparent;
      }

      .dx-chat-messagelist-empty-view,
      .dx-chat-messagebox {
        padding-top: 0px;
      }
    </style>
  </head>
  <body style="min-height: 100%;" class="dx-viewport">
    <div class="demo-container">
      <div id="form-container"></div>
      <div id="grid-container"></div>
      <div id="ai-fab"></div>
      <div id="aiAssistantContainer"></div>
    </div>
  </body>
</html>
